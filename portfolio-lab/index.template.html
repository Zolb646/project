<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151513"><meta name="description" content="Walk through Zozo’s workroom, a spatial portfolio of four web and mobile projects from Ulaanbaatar.">
  <title>Zolbayar Byambajav — Selected Work</title><link rel="icon" href="media/mark.svg" type="image/svg+xml">
  <link rel="preload" href="media/terminal.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="room.css"><link rel="stylesheet" href="workbench.css"><script type="module" src="room.js"></script>
</head><body>
<header>
  <a class="brand" href="#entrance" aria-label="Zozo, entrance"><img src="media/mark.svg" width="32" height="32" alt="">Zozo<span>/ Portfolio</span></a>
  <div class="header-location">Ulaanbaatar, Mongolia</div>
  <div class="header-links"><a href="#assembly">About</a><a href="#contact">Contact</a></div>
  <a class="portfolio" href="https://new.zolbayrr.com">Full portfolio <span aria-hidden="true">↗</span></a>
</header>
<main><div class="viewport"><canvas class="journey" aria-hidden="true"></canvas><!-- panels --></div></main>
<nav aria-label="Gallery navigation" hidden>
  <div class="index"><span id="counter" aria-hidden="true">00 / 04</span><select aria-label="Jump to a gallery stop"><!-- stops --></select></div>
  <div class="track" aria-label="Gallery stops"><!-- track --></div>
  <div class="arrows"><button type="button" id="prev" aria-label="Previous stop">←</button><button type="button" id="next" aria-label="Next stop">→</button></div>
</nav>
<dialog aria-labelledby="viewer-title"><header class="viewer-bar"><h2 id="viewer-title"></h2><button type="button" class="close">Close ×</button></header>
  <div class="viewer-stage">
    <button type="button" class="flank previous" aria-label="Previous project"><img alt=""><span></span></button>
    <img class="featured" alt="">
    <button type="button" class="flank following" aria-label="Next project"><img alt=""><span></span></button>
  </div><footer><p id="viewer-caption" aria-live="polite"></p><button type="button" class="switch">Next image →</button></footer>
</dialog>
</body></html>
